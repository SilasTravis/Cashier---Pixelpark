name: Windows build

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
  workflow_dispatch: {}

env:
  API_BASE_URL: https://test.api.pixelpark.uz/api

jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze

  build_windows:
    runs-on: windows-latest
    needs: analyze
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: cashier_app-windows-${{ github.sha }}
          path: build/windows/x64/runner/Release/
          retention-days: 30
