name: cashier_app
description: "Bolajon kassa terminali — Flutter Windows desktop POS."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # di
  get_it: ^9.2.1
  dartz: ^0.10.1
  # state manager
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  # cache
  hive_ce: ^2.19.3
  path_provider: ^2.1.6
  # rest api
  dio: ^5.11.0
  dio_retry_plus: ^2.0.8
  # language
  intl: ^0.20.2
  # qr code rendering (gate-pass slips)
  qr_flutter: ^4.1.0
  # icons matching the Cashier design system (Phosphor)
  phosphor_flutter: ^2.1.0
  # frameless window + custom title bar
  window_manager: ^0.4.3
  # app version for the background update checker
  package_info_plus: ^10.2.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  intl_utils: ^2.8.7

flutter:
  uses-material-design: true

flutter_intl:
  enabled: true
  class_name: AppLocalization
  arb-dir: lib/l10n
  preferred-supported-locales:
    - uz
  use-deferred-loading: true
