name: cashier_app
description: "Bolajon kassa terminali — Flutter Windows desktop POS."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # di
  get_it: ^9.2.1
  dartz: ^0.10.1
  # state manager
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  # cache
  hive_ce: ^2.19.3
  path_provider: ^2.1.6
  # rest api
  dio: ^5.11.0
  dio_retry_plus: ^2.0.8
  # language
  intl: ^0.20.2
  # qr code rendering (gate-pass slips)
  qr_flutter: ^4.1.0
  # gate-pass sticker print job (58x40mm label) + OS print dialog/spooler
  pdf: ^3.11.3
  printing: ^5.14.2
  # icons matching the Cashier design system (Phosphor) — funccloud fork,
  # not upstream phosphor_flutter: upstream subclasses IconData, which
  # Flutter 3.43+ made a final class, breaking the build.
  phosphor_icons: ^3.0.1
  # frameless window + custom title bar
  window_manager: ^0.4.3
  # app version, compared against the latest GitHub release tag
  package_info_plus: ^10.2.1
  uuid: ^4.6.0
  # self-update: unpack the release zip and verify its published SHA-256
  archive: ^4.0.9
  crypto: ^3.0.7
  # already resolved transitively via Flutter; pinned to the exact version
  # in pubspec.lock so declaring it explicitly (for path-relativizing in
  # tests) doesn't move anything else in the dependency graph
  path: 1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  intl_utils: ^2.8.7
  # already resolved transitively via flutter_test; pinned to the exact
  # version in pubspec.lock so declaring it explicitly (for deterministic
  # virtual-clock timer tests) doesn't move anything else in the graph
  fake_async: 1.3.3
  # already resolved transitively via path_provider; pinned to the exact
  # version in pubspec.lock so declaring it explicitly (to fake
  # getApplicationSupportPath() via the platform-interface seam instead of
  # channel mocking) doesn't move anything else in the graph
  path_provider_platform_interface: 2.1.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/gate_pass_label_bg.png

flutter_intl:
  enabled: true
  class_name: AppLocalization
  arb-dir: lib/l10n
  preferred-supported-locales:
    - uz
  use-deferred-loading: true
